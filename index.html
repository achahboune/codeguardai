<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            margin:0;
            font-family:Arial,Helvetica,sans-serif;
            background:#f5f7fa;
            color:#333;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }
        header{
            background:#2c3e50;
            color:#fff;
            padding:2rem 1rem;
            text-align:center;
        }
        header h1{
            margin:0;
            font-size:2.2rem;
        }
        main{
            flex:1;
            max-width:960px;
            margin:2rem auto;
            padding:0 1rem;
        }
        .hero{
            text-align:center;
            margin-bottom:2rem;
        }
        .hero p{
            font-size:1.2rem;
            margin:1rem 0;
        }
        .demo{
            background:#fff;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
            padding:1.5rem;
        }
        textarea{
            width:100%;
            height:120px;
            font-family:monospace;
            font-size:0.95rem;
            padding:0.5rem;
            border:1px solid #ccc;
            border-radius:4px;
            resize:vertical;
        }
        button{
            background:#27ae60;
            color:#fff;
            border:none;
            padding:0.6rem 1.2rem;
            margin-top:0.8rem;
            border-radius:4px;
            cursor:pointer;
            font-size:1rem;
        }
        button:hover{
            background:#219150;
        }
        .result{
            margin-top:1rem;
            background:#f0f9f5;
            border-left:4px solid #27ae60;
            padding:1rem;
            border-radius:4px;
            display:none;
        }
        .result ul{
            margin:0;
            padding-left:1.2rem;
        }
        footer{
            background:#2c3e50;
            color:#fff;
            text-align:center;
            padding:1rem;
            font-size:0.9rem;
        }
        @media (max-width:600px){
            header h1{font-size:1.8rem;}
            .hero p{font-size:1rem;}
        }
    </style>
<title>CodeGuardAI – AI Pull Request Review for Open Source</title>
<meta name="description" content="CodeGuardAI reviews pull requests, flagging bugs, security vulnerabilities and bad coding practices to help open‑source maintainers and dev teams improve">
<meta property="og:title" content="CodeGuardAI – AI Pull Request Review for Open Source">
<meta property="og:description" content="CodeGuardAI reviews pull requests, flagging bugs, security vulnerabilities and bad coding practices to help open‑source maintainers and dev teams improve">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="CodeGuardAI – AI Pull Request Review for Open Source">
<meta name="twitter:description" content="CodeGuardAI reviews pull requests, flagging bugs, security vulnerabilities and bad coding practices to help open‑source maintainers and dev teams improve">
<link rel="canonical" href="https://achahboune.github.io/codeguardai/">
<meta property="og:url" content="https://achahboune.github.io/codeguardai/">
</head>
<body>
    <header>
        <h1>CodeGuardAI</h1>
    </header>
    <main>
        <section class="hero">
            <p>AI-powered pull‑request review that spots bugs, security issues and bad practices automatically.</p>
        </section>
        <section class="demo">
            <h2>Try the demo</h2>
            <p>Paste a small code snippet and see what CodeGuardAI would flag.</p>
            <textarea id="codeInput">// Example JavaScript
function add(a,b){
    return a + b
}
</textarea>
            <button id="analyzeBtn">Analyze</button>
            <div class="result" id="resultBox">
                <strong>Findings:</strong>
                <ul id="findingsList"></ul>
            </div>
        </section>
    </main>
    <footer>
        © 2026 CodeGuardAI – Empowering open‑source maintainers
    </footer>

    <script>
        const issues = [
            {type:"Bug", pattern:/return\s+[^;]+;/, message:"Missing semicolon after return statement."},
            {type:"Security", pattern:/eval\(/, message:"Use of eval can lead to security vulnerabilities."},
            {type:"Best Practice", pattern:/function\s+\w+\s*\([^)]*\)\s*{[^}]*}/, message:"Consider using arrow functions for concise syntax."}
        ];

        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const code = document.getElementById('codeInput').value;
            const findings = [];

            issues.forEach(issue => {
                if(issue.pattern.test(code)){
                    findings.push(issue.message);
                }
            });

            const resultBox = document.getElementById('resultBox');
            const list = document.getElementById('findingsList');
            list.innerHTML = '';

            if(findings.length===0){
                list.innerHTML = '<li>No issues detected. Your code looks clean!</li>';
            }else{
                findings.forEach(msg=> {
                    const li=document.createElement('li');
                    li.textContent=msg;
                    list.appendChild(li);
                });
            }
            resultBox.style.display='block';
        });
    </script>
</body>
</html>
